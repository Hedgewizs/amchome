<main class="article"><div class="wrap">
  <div class="breadcrumb"><a href="index.html">首頁</a> / 聯絡</div>
  <h1>聯絡 AMC</h1>
  <p class="standfirst">產品問題、經銷洽詢，或正在規劃安裝案——告訴我們你在打造什麼。</p>

  <!-- 聯絡信箱：support@amchome.com -->
  <form action="mailto:support@amchome.com" method="post" enctype="text/plain" style="max-width:620px">
    <div class="field">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="topic">我想了解</label>
      <select id="topic" name="topic">
        <option>智慧家庭系統 / 安裝</option>
        <option>Hi-Fi 器材</option>
        <option>成為經銷商</option>
        <option>產品支援 / 說明書</option>
        <option>其他</option>
      </select>
    </div>
    <div class="field">
      <label for="message">訊息</label>
      <textarea id="message" name="message" placeholder="幾個房間？看上哪幾台？你在什麼地區？" required></textarea>
    </div>
    <button class="btn" type="submit" style="border:none;cursor:pointer">送出洽詢</button>
    <p class="form-note">這會開啟你的郵件 App 並自動填好洽詢內容——本站不儲存任何資料。</p>
  </form>
</div></main>
